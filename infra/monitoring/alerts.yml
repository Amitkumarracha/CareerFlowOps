groups:
  - name: careerflowops
    rules:
      - alert: CareerFlowOpsApiDown
        expr: up{job="careerflowops-api"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: API metrics have been unreachable for five minutes
      - alert: CareerFlowOpsReadinessFailure
        expr: sum(increase(careerflowops_http_requests_total{route="/ready",status="503"}[10m])) >= 3
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: API readiness is repeatedly failing; inspect database and model integrity
      - alert: CareerFlowOpsServerErrors
        expr: |
          (sum(rate(careerflowops_http_requests_total{status=~"5.."}[5m]))
            / sum(rate(careerflowops_http_requests_total[5m])) > 0.05)
          and sum(increase(careerflowops_http_requests_total{status=~"5.."}[10m])) >= 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: API server errors exceed five percent with repeated failures
      - alert: CareerFlowOpsIngestionFailure
        expr: sum(increase(careerflowops_ingestion_runs_total{status=~"failed|partial"}[1h])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A live ingestion run failed or completed partially; inspect Source health
