name: careerflowops
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-careerflowops}
      POSTGRES_USER: ${POSTGRES_USER:-careerflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
  api:
    image: ${API_IMAGE:-careerflowops-api:local}
    restart: unless-stopped
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    command: ["sh", "-c", "alembic -c apps/api/alembic.ini upgrade head && uvicorn apps.api.app.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      postgres: {condition: service_healthy}
    volumes: ["./data:/app/data", "./ml/artifacts:/app/ml/artifacts:ro"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
  mlflow:
    image: ${API_IMAGE:-careerflowops-api:local}
    restart: unless-stopped
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--workers", "1", "--backend-store-uri", "sqlite:////app/mlflow-data/mlflow.db", "--artifacts-destination", "/app/mlflow-data/artifacts", "--serve-artifacts", "--allowed-hosts", "mlflow:5000,localhost:5000,127.0.0.1:5000", "--cors-allowed-origins", "http://localhost:5000"]
    ports: ["127.0.0.1:5000:5000"]
    volumes: ["./mlflow-data:/app/mlflow-data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
  web:
    image: ${WEB_IMAGE:-careerflowops-web:local}
    restart: unless-stopped
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports: ["127.0.0.1:${WEB_PORT:-5173}:80"]
    depends_on:
      api: {condition: service_healthy}
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    profiles: [monitoring]
    ports: ["127.0.0.1:9090:9090"]
    volumes: ["./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "prometheus-data:/prometheus"]
    depends_on:
      api: {condition: service_healthy}
  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboard.json:/var/lib/grafana/dashboards/careerflowops.json:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
volumes:
  prometheus-data:
  grafana-data:
  postgres-data:
